networks:
  default:
    external: true
    name: traefik

services:
  fe:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./dist:/usr/share/nginx/html
    labels:
      traefik.enable: true
      traefik.http.services.nut.loadbalancer.server.port: 80
      traefik.http.routers.nut.rule: Host(`nut.ygh.kr`)
      traefik.http.routers.nut.entrypoints: websecure
      traefik.http.routers.nut.tls: true
      traefik.http.routers.nut.tls.certresolver: letsencrypt
    configs:
      - source: nginx-config
        target: /etc/nginx/conf.d/default.conf

configs:
  nginx-config:
    content: |
      server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;

        location / {
          try_files $$uri $$uri/ /index.html;
        }
      }
